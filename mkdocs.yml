site_name: AlessandroKlein Docs
site_description: Documentación unificada de los proyectos de AlessandroKlein
site_url: https://alessandroklein.github.io/Docs/
site_author: AlessandroKlein
copyright: "© 2026 AlessandroKlein"

repo_url: https://github.com/AlessandroKlein/Docs
repo_name: AlessandroKlein/Docs

theme:
  name: material
  language: es
  icon:
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue grey
      toggle:
        icon: material/weather-night
        name: Cambiar a oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue grey
      toggle:
        icon: material/weather-sunny
        name: Cambiar a claro
  features:
    # Navegación
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.tracking
    # Índice (TOC)
    - toc.follow
    - toc.integrate
    # Búsqueda
    - search.suggest
    - search.highlight
    - search.share
    # Contenido
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    # Cabecera
    - header.autohide

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.critic

plugins:
  - search
  - tags
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: es
          default: true
          name: Español
          build: true
        - locale: en
          name: English
          build: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AlessandroKlein

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js

nav:
  - Inicio: index.md
  - Invernadero:
      - Home: invernadero/Home.md
      - Arquitectura: invernadero/Arquitectura.md
      - Compatibilidad (placas/sensores/buses): invernadero/Compatibilidad.md
      - Hardware y conexiones: invernadero/Hardware-y-Conexiones.md
      - Sensores: invernadero/Sensores.md
      - Actuadores y salidas: invernadero/Actuadores-y-Salidas.md
      - Materiales (BOM): invernadero/Materiales.md
      - Configuración: invernadero/Configuracion.md
      - Variables modificables: invernadero/Variables-Modificables.md
      - API REST: invernadero/API-REST.md
      - MQTT y WebSocket: invernadero/MQTT-y-WebSocket.md
      - Estación meteorológica: invernadero/Estacion-meteorologica.md
      - OTA y actualización: invernadero/OTA-y-Actualizacion.md
      - Servidor central: invernadero/Servidor-central.md
      - Seguridad: invernadero/Seguridad.md
      - Identidad y estados: invernadero/Identidad-y-Estados.md
      - Decisiones: invernadero/Decisiones.md
      - Compilación y flasheo: invernadero/Compilacion.md
      - Evolución: invernadero/Evolucion.md
      - Mejoras y roadmap: invernadero/Mejoras.md
      - Versiones (CHANGELOG): invernadero/CHANGELOG.md
      - Registro de cambios: invernadero/Registro-de-cambios.md
      - Frontend (guía de estilo): invernadero/Frontend.md
      - Glosario: invernadero/Glosario.md
  - SEMA:
      - Home: sema/Home.md
