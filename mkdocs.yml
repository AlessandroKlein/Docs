site_name: AlessandroKlein Docs
site_description: Documentación unificada de los proyectos de AlessandroKlein
site_url: https://alessandroklein.github.io/Docs/
site_author: AlessandroKlein
copyright: "© 2026 AlessandroKlein"

repo_url: https://github.com/AlessandroKlein/Docs
repo_name: AlessandroKlein/Docs

theme:
  name: material
  language: es
  custom_dir: overrides
  icon:
    repo: fontawesome/brands/github
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue grey
      toggle:
        icon: material/weather-night
        name: Cambiar a oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue grey
      toggle:
        icon: material/weather-sunny
        name: Cambiar a claro
  features:
    # Navegación
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.tracking
    # Índice (TOC)
    - toc.follow
    - toc.integrate
    # Búsqueda
    - search.suggest
    - search.highlight
    - search.share
    # Contenido
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    # Cabecera
    - header.autohide

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.critic

plugins:
  - search
  - tags
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: es
          default: true
          name: Español
          build: true
        - locale: en
          name: English
          build: true

extra:
  generator: false
  consent:
    title: Cookies
    description: Usamos cookies para recordar tus preferencias (tema e idioma).
    actions:
      - accept
      - reject
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AlessandroKlein

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js

