site_name: AlessandroKlein Docs
site_description: Documentación unificada de los proyectos de AlessandroKlein
site_url: https://alessandroklein.github.io/Docs/
site_author: AlessandroKlein

# --- Color negro/gris (sin verde) ---
theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue grey
      toggle:
        icon: material/weather-night
        name: Cambiar a oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue grey
      toggle:
        icon: material/weather-sunny
        name: Cambiar a claro
  features:
    - navigation.tabs          # menú superior con categorías
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/AlessandroKlein/Docs

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - tags
  - optimize
  - offline
  - info

nav:
  - Inicio: index.md
  - Invernadero:
      - Home: invernadero/Home.md
      - Arquitectura: invernadero/Arquitectura.md
      - Hardware y conexiones: invernadero/Hardware-y-Conexiones.md
      - Configuración: invernadero/Configuracion.md
      - API REST: invernadero/API-REST.md
      - Decisiones: invernadero/Decisiones.md
      - Compilación y flasheo: invernadero/Compilacion.md
      - Evolución: invernadero/Evolucion.md
      - Registro de cambios: invernadero/Registro-de-cambios.md
      - Glosario: invernadero/Glosario.md
  - SEMA:
      - Home: sema/Home.md
